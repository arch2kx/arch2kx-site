name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query guestbook
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/guestbook.ts)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/guestbook.ts)
          curl -fsS "$URL/rest/v1/guestbook?select=created_at&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
